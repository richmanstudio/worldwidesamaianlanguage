name: Materialize authored SAMA lexicon 750
on:
  push:
    branches: [sama/lexicon-750-20261122]
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ github.event.head_commit.message == 'chore: trigger SAMA 0.14.0 materialization' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Materialize verified editorial rows
        run: node scripts/adopt-lexicon-750.mjs
      - name: Commit canonical output to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/lexicon-v1.json content/verb-frames.json content/standard-release.json content/schemas/lexeme.schema.json content/usage-examples.json reports/lexicon-750-provenance.json
          git diff --cached --quiet && exit 1
          git commit -m "chore: materialize SAMA 0.14.0 normative datasets [skip ci]"
          git push origin HEAD:sama/lexicon-750-20261122
